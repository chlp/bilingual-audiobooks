const IMAGES = {};   // {chapterIdx: [{tr, orig, pos, src, t}]}
const cues = DATA.cues;
const chapters = DATA.chapters;
const KEY = 'bab:' + CFG.slug;     // префикс localStorage для этой книги

const $ = id => document.getElementById(id);
const audio = $('audio');
const chapterSelect = $('chapterSelect');
const rateSelect = $('rateSelect');
const autoScrollBtn = $('autoScrollBtn');

function lsGet(k, def) { try { const v = localStorage.getItem(KEY + ':' + k); return v === null ? def : v; } catch (e) { return def; } }

let autoScroll = lsGet('autoScroll', '1') === '1';
let fontSize = parseInt(lsGet('font', '16'), 10) || 16;
let currentChapterIndex = -1;
let currentCueIndex = -1;
let currentTrIndex = -1;
// Перемотка до загрузки метаданных (iOS не грузит mp3 до первого play):
// запоминаем цель и применяем на loadedmetadata/play.
let pendingSeek = null;

chapters.forEach((ch, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${ch.ruNum}. ${ch.ruTitle}`;
  chapterSelect.appendChild(opt);
});

function fmtTime(t) {
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = Math.floor(t % 60);
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;

function findChapterIndex(t) {
  for (let i = chapters.length - 1; i >= 0; i--) if (t >= chapters[i].timeStart) return i;
  return 0;
}

function lastStartBefore(arr, t, lo = 0, hi = arr.length) {
  let a = lo, b = hi - 1, ans = lo;
  while (a <= b) {

    if (arr[mid].start <= t) { ans = mid; a = mid + 1; } else b = mid - 1;

  return ans;
}

function getTime() { return pendingSeek !== null ? pendingSeek : audio.currentTime; }

function seek(t, play) {

  if (audio.readyState >= 1) { audio.currentTime = t; pendingSeek = null; }

function makeFigure(img) {
  const fig = document.createElement('figure');
  fig.className = 'illus';
  const im = document.createElement('img');
  im.src = img.src;
  im.alt = '';
  im.loading = 'lazy';
  // размеры заранее: иначе lazy-картинки сдвигают текст и восстановленная прокрутка уезжает
  if (img.w && img.h) { im.width = img.w; im.height = img.h; }
  im.addEventListener('error', () => fig.remove());  // картинка ещё не нарисована
  fig.appendChild(im);
  fig.addEventListener('click', () => seek(img.t, true));
  return fig;
}

function renderChapter(idx) {
  const ch = chapters[idx];
  currentChapterIndex = idx;
  currentCueIndex = -1;
  currentTrIndex = -1;

  $('origHeading').textContent = `${ch.ruNum}. ${ch.svTitle || ch.ruTitle}`;
  $('transHeading').textContent = `${ch.ruNum}. ${ch.ruTitle}`;
  const imgs = IMAGES[idx] || [];
  const at = (key, i, pos) => imgs.filter(im => im[key] === i && im.pos === pos);

  origContent.innerHTML = '';
  let prevPara = null;
  for (let c = ch.cueStart; c < ch.cueEnd; c++) {
    const div = document.createElement('div');
    div.className = 'line orig-line';
    if (cues[c].para !== undefined && prevPara !== null && cues[c].para !== prevPara) div.classList.add('new-para');
    prevPara = cues[c].para;
    div.dataset.i = c;
    div.textContent = cues[c].text;
    div.addEventListener('click', () => seek(cues[c].start, true));
    at('orig', c, 'before').forEach(im => origContent.appendChild(makeFigure(im)));
    origContent.appendChild(div);
    at('orig', c, 'after').forEach(im => origContent.appendChild(makeFigure(im)));
  }

  transContent.innerHTML = '';
  prevPara = null;
  ch.ruLines.forEach((rl, ri) => {
    const div = document.createElement('div');
    div.className = 'line trans-line';
    if (prevPara !== null && rl.para !== prevPara) div.classList.add('new-para');
    prevPara = rl.para;
    div.dataset.i = ri;
    div.textContent = rl.text;
    div.addEventListener('click', () => seek(rl.start, true));
    at('tr', ri, 'before').forEach(im => transContent.appendChild(makeFigure(im)));
    transContent.appendChild(div);
    at('tr', ri, 'after').forEach(im => transContent.appendChild(makeFigure(im)));
  });

  renderChapterNav(idx);
  chapterSelect.value = idx;
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: `${ch.ruNum}. ${ch.ruTitle}`, album: CFG.title }); } catch (e) {}
  }
}

// Ссылки «Предыдущая глава» над заголовком и «Следующая глава» под текстом,
// в обеих колонках; названия -- на языке колонки.
function renderChapterNav(idx) {
  const make = (target, dir, orig) => {
    const ch = chapters[target];
    const b = document.createElement('button');
    const d = document.createElement('span');
    d.className = 'dir';
    d.textContent = dir;
    b.append(d, `${ch.ruNum}. ${orig ? (ch.svTitle || ch.ruTitle) : ch.ruTitle}`);
    b.addEventListener('click', () => goToChapter(target));
    return b;
  };
  [[origPanel, true], [transPanel, false]].forEach(([panel, orig]) => {
    const prev = panel.querySelector('.chapter-nav.prev');
    const next = panel.querySelector('.chapter-nav.next');
    prev.innerHTML = ''; next.innerHTML = '';
    if (idx > 0) prev.append(make(idx - 1, 'Предыдущая глава', orig));
    if (idx < chapters.length - 1) next.append(make(idx + 1, 'Следующая глава', orig));
  });
}

function goToChapter(idx) {
  const playing = !audio.paused;
  renderChapter(idx);
  seek(chapters[idx].timeStart + 0.05, playing);
  origPanel.scrollTop = 0; transPanel.scrollTop = 0;
}

// Не scrollIntoView: тот прокручивает и все предки, включая окно, и на iPad
// из-за этого шапка уезжает. Прокручиваем только саму колонку.
function centerInPanel(el, instant) {
  const panel = el.closest('.panel');
  if (!panel.offsetParent) return;
  const pr = panel.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  const top = panel.scrollTop + (er.top - pr.top) - (panel.clientHeight - er.height) / 2;
  panel.scrollTo({ top: Math.max(0, top), behavior: instant ? 'auto' : 'smooth' });
}

function setCurrent(container, idx, scroll) {
  const prev = container.querySelector('.line.current');
  if (prev) prev.classList.remove('current');
  const el = container.querySelector(`.line[data-i="${idx}"]`);
  if (el) {
    el.classList.add('current');
    if (scroll) centerInPanel(el);
  }
}

// Подсветить строки, соответствующие моменту t. scroll -- прокрутить к ним.
function syncTo(t, scroll) {
  const chIdx = findChapterIndex(t);
  if (chIdx !== currentChapterIndex) renderChapter(chIdx);
  const ch = chapters[chIdx];

  const cueIdx = lastStartBefore(cues, t, ch.cueStart, ch.cueEnd);
  if (cueIdx !== currentCueIndex || scroll) setCurrent(origContent, cueIdx, scroll);
  currentCueIndex = cueIdx;

  if (ch.ruLines.length) {
    const trIdx = lastStartBefore(ch.ruLines, t);
    if (trIdx !== currentTrIndex || scroll) setCurrent(transContent, trIdx, scroll);
    currentTrIndex = trIdx;
  }
  statusLine.textContent = `Глава ${ch.ruNum} — ${fmtTime(t)} / ${fmtTime(DATA.duration)}`;
}

let lastAuto = { cue: -1, tr: -1 };
audio.addEventListener('timeupdate', () => {
  if (pendingSeek !== null) return;   // ещё не перемотались: не затирать позицию нулём
  const t = audio.currentTime;
  const prevCue = currentCueIndex, prevTr = currentTrIndex, prevCh = currentChapterIndex;
  syncTo(t, false);
  if (autoScroll && (currentCueIndex !== prevCue || currentTrIndex !== prevTr || currentChapterIndex !== prevCh)) {
    const a = origContent.querySelector('.line.current'); if (a) centerInPanel(a);
    const b = transContent.querySelector('.line.current'); if (b) centerInPanel(b);
  }
  throttledSave();
});

chapterSelect.addEventListener('change', () => goToChapter(parseInt(chapterSelect.value, 10)));
rateSelect.addEventListener('change', () => {
  audio.playbackRate = parseFloat(rateSelect.value);
  lsSet('rate', rateSelect.value);
});
autoScrollBtn.classList.toggle('active', autoScroll);
autoScrollBtn.addEventListener('click', () => {
  autoScroll = !autoScroll;
  autoScrollBtn.classList.toggle('active', autoScroll);
  lsSet('autoScroll', autoScroll ? '1' : '0');
});

function applyLang(mode) {
  panels.classList.toggle('only-orig', mode === 'orig');
  panels.classList.toggle('only-trans', mode === 'trans');
  langSelect.value = mode;
  lsSet('lang', mode);
  panels.querySelectorAll('.line.current').forEach(el => centerInPanel(el, true));
}
langSelect.addEventListener('change', () => applyLang(langSelect.value));

function applyFontSize() {
  document.documentElement.style.setProperty('--font-size', fontSize + 'px');
  lsSet('font', fontSize);
}
$('fontMinus').addEventListener('click', () => { fontSize = Math.max(12, fontSize - 1); applyFontSize(); });
$('fontPlus').addEventListener('click', () => { fontSize = Math.min(32, fontSize + 1); applyFontSize(); });

// ---- Запоминание места: глава, время аудио, прокрутка обеих колонок ----
function savePosition() {
  if (currentChapterIndex < 0) return;
  lsSet('pos', JSON.stringify({
    ch: currentChapterIndex, t: Math.round(getTime() * 10) / 10,
    so: Math.round(origPanel.scrollTop), st: Math.round(transPanel.scrollTop),
  }));
}
let saveTimer = null;
function throttledSave() {
  if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; savePosition(); }, 1500);
}
let scrollTimer = null;
[origPanel, transPanel].forEach(p => p.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(savePosition, 400);
}, { passive: true }));
audio.addEventListener('pause', savePosition);
window.addEventListener('pagehide', savePosition);
document.addEventListener('visibilitychange', () => { if (document.hidden) savePosition(); });

// ---- Ссылка на место: #t=<секунды> ----
function isVisibleIn(el, panel) {
  const pr = panel.getBoundingClientRect(), er = el.getBoundingClientRect();
  return er.bottom > pr.top + 30 && er.top < pr.bottom;
}
// Место = текущая строка, если её видно; иначе первая видимая строка колонки
// (пользователь пролистал текст на паузе).
function placeTime() {
  const panel = origPanel.offsetParent ? origPanel : transPanel;
  const content = panel === origPanel ? origContent : transContent;
  const cur = content.querySelector('.line.current');
  if (cur && isVisibleIn(cur, panel)) return getTime();
  const ch = chapters[currentChapterIndex];
  for (const el of content.querySelectorAll('.line')) {
    if (isVisibleIn(el, panel)) {
      const i = parseInt(el.dataset.i, 10);
      return panel === origPanel ? cues[i].start : ch.ruLines[i].start;
    }
  }
  return getTime();
}
function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 3500);
}
async function copyText(text) {
  // writeText может не ответить (нет разрешения / file://) -- не ждём дольше секунды
  try {
    const ok = await Promise.race([
      navigator.clipboard.writeText(text).then(() => true),
      new Promise(r => setTimeout(() => r(false), 1000)),
    ]);
    if (ok) return true;
  } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}
$('copyLinkBtn').addEventListener('click', async () => {
  const t = Math.max(0, Math.floor(placeTime() * 10) / 10);
  const url = location.href.split('#')[0] + '#t=' + t;
  const ok = await copyText(url);
  showToast((ok ? 'Ссылка скопирована: ' : 'Скопируйте ссылку: ') + url);
});

function timeFromHash() {
  const m = location.hash.match(/[#&]t=([\d.]+)/);
  if (m) return parseFloat(m[1]);
  const c = location.hash.match(/[#&]ch=(\d+)/);   // #ch=<номер главы из книги>
  if (c) {
    const ch = chapters.find(x => x.ruNum === parseInt(c[1], 10));
    if (ch) return ch.timeStart + 0.05;
  }
  return null;
}

  const t = timeFromHash();
  if (t === null) return false;

  if (e.code !== 'Space' || e.target.closest('select, button, input, audio, textarea')) return;

// ---- init ----
applyFontSize();
{
  const r = lsGet('rate', '1');
  if ([...rateSelect.options].some(o => o.value === r)) { rateSelect.value = r; audio.playbackRate = parseFloat(r); }

    pendingSeek = pos.t;
    applyPendingSeek();
    syncTo(pos.t, false);

    requestAnimationFrame(() => {
      origPanel.style.scrollBehavior = transPanel.style.scrollBehavior = 'auto';
      origPanel.scrollTop = pos.so || 0;
