<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Двуязычные книжки</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Шведско-русские книжки-плееры с иллюстрациями: текст подсвечивается под звук.">
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --text: #24211c; --muted: #7a7468;
    --border: #e4ddcf; --accent: #b5502f; --shadow: rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --card: #211d16; --text: #ece6da; --muted: #9c9384;
      --border: #3a3427; --accent: #e0854f; --shadow: rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { margin: 0 0 8px; font-size: 28px; color: var(--accent); }
  .lead { margin: 0 0 32px; color: var(--muted); max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  a.card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none;
    box-shadow: 0 1px 4px var(--shadow); transition: transform .15s; }
  a.card:hover { transform: translateY(-2px); }
  .cover { aspect-ratio: 3 / 2; background: var(--border) center / cover no-repeat;
    display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--muted); }
  .body { padding: 14px 16px 16px; }
  .body h2 { margin: 0; font-size: 18px; }
  .sub { color: var(--muted); font-size: 14px; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .about { margin: 8px 0 0; font-size: 13px; }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Двуязычные книжки</h1>
  <p class="lead">Шведский текст слева, русский перевод справа. Строка подсвечивается под
    звук, клик по строке переносит туда аудио. Плеер запоминает, где вы остановились.</p>
  <div class="grid" id="grid"></div>
  <footer>Как сделать такую книжку: <a href="https://github.com/chlp/bilingual-audiobooks">github.com/chlp/bilingual-audiobooks</a></footer>
</main>
<script>
fetch('catalog.json').then(r => r.json()).then(books => {
  const grid = document.getElementById('grid');
  for (const b of books) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `books/${encodeURIComponent(b.slug)}/`;
    const cover = document.createElement('div');
    cover.className = 'cover';
    if (b.cover) cover.style.backgroundImage = `url("${b.cover}")`; else cover.textContent = '📖';
    const body = document.createElement('div');
    body.className = 'body';
    const h = document.createElement('h2'); h.textContent = b.title;
    const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = b.subtitle || '';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = `${b.langs} · глав: ${b.chapters} · ${b.minutes} мин`;
    body.append(h, sub, meta);
    if (b.about) { const p = document.createElement('p'); p.className = 'about'; p.textContent = b.about; body.append(p); }
    a.append(cover, body);
    grid.append(a);
  }
});
</script>
</body>
</html>
